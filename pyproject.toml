[project]
name = "annamsetu"
version = "0.1.0"
description = "AnnamSetu: surplus food forecasting, SafeClock and NGO pre-booking for hostel kitchens (team MIND MATRIX)"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs PostgreSQL (Testcontainers on laptops, a service in CI)"]
# Starlette's StarletteDeprecationWarning is a UserWarning subclass (trap 11 in 1.3)
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient.:UserWarning"]

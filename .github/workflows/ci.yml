name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env: { POSTGRES_DB: annamsetu, POSTGRES_USER: annamsetu, POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U annamsetu" --health-interval 5s --health-retries 10
    env:
      APP_SECRET_KEY: ci-only-not-a-secret
      APP_DATABASE_URL: postgresql+psycopg://annamsetu:ci@localhost:5432/annamsetu
      TEST_DATABASE_URL: postgresql+psycopg://annamsetu:ci@localhost:5432/annamsetu
      APP_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m alembic upgrade head && python -m alembic downgrade base && python -m alembic upgrade head
      - run: python -m pytest -q
